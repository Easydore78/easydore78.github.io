<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easydore78</title>
<meta name="description" content="FlowDay — a visual planner to stay focused.">
<style>
  :root{
    --bg:#1A1A2E;
    --panel:#232342;
    --text:#F2F2F7;
    --muted:#9C9CB8;
    --violet:#7F77DD;
    --vert:#1D9E75;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
  }
  .wrap{max-width:420px;padding:24px}
  .logo{
    width:88px;height:88px;border-radius:22px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--violet),var(--vert));
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:700;color:#fff;
  }
  h1{font-size:1.6rem;margin:0 0 10px}
  p{color:var(--muted);margin:0 0 24px}
  a.btn{
    display:inline-block;padding:12px 22px;border-radius:10px;
    background:var(--panel);color:var(--text);text-decoration:none;
    border:1px solid var(--violet);font-weight:600;
  }
  a.btn:hover{background:var(--violet)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">F</div>
  <h1>FlowDay</h1>
  <p>A visual planner to stay focused on what matters.</p>
  <a class="btn" href="https://easydore78.github.io/flowday/">Visit the FlowDay site →</a>
</div>
</body>
</html>
